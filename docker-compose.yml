services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8080
    depends_on:
      - backend
